name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Grant minimal permissions needed so the action can run for Dependabot and other bot actors
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Pre-compile Python to catch syntax errors
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir compileall
          python -m compileall -q .

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2
